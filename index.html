<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urban Cool | Oversized tees, hoodies, crop tops and totes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F4;--surface:#FFFFFF;--ink:#15171C;--muted:#5F6572;--line:#DFE1E6;
  --accent:#2E45FF;--accent-ink:#FFFFFF;--sale:#D92D4A;--good:#0F8A5F;--tile:#E4E7EE;--overlay:rgba(10,12,16,.55);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1114;--surface:#181B20;--ink:#F1F2F4;--muted:#A0A6B2;--line:#2A2E36;--accent:#8796FF;--accent-ink:#0F1114;--sale:#FF6B84;--good:#3DD9A0;--tile:#22262E;--overlay:rgba(0,0,0,.65)}
}
:root[data-theme="dark"]{--bg:#0F1114;--surface:#181B20;--ink:#F1F2F4;--muted:#A0A6B2;--line:#2A2E36;--accent:#8796FF;--accent-ink:#0F1114;--sale:#FF6B84;--good:#3DD9A0;--tile:#22262E;--overlay:rgba(0,0,0,.65)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Archivo,"Arial Black",system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-family:Archivo,sans-serif;font-weight:900;font-size:22px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.search{flex:1;min-width:0}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 12px}
.acts{display:flex;gap:4px}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:8px}
.ib:hover{background:var(--bg)}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
.dot.on{display:grid}

/* hero */
.hero{display:grid;gap:8px;grid-template-columns:1fr;align-items:center;padding:24px 0 8px}
.hero-copy h1{font-weight:900;font-size:clamp(34px,8vw,68px);letter-spacing:-.035em}
.hero-copy p{color:var(--muted);max-width:44ch;margin:14px 0 20px;font-size:16px}
.hero-art{background:var(--accent);border-radius:20px;display:flex;justify-content:center;align-items:flex-end;padding:20px 12px 0;overflow:hidden;min-height:220px}
.hero-art svg{width:46%;max-width:250px;height:auto}
.hero-art svg+svg{margin-left:-6%;transform:translateY(6%)}
@media(min-width:800px){.hero{grid-template-columns:1.1fr 1fr;gap:32px;padding:36px 0 16px}.hero-art{min-height:340px}}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:8px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.perks{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px;padding:8px 0 4px}
.perks b{color:var(--ink)}

/* filters */
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{height:36px;padding:0 16px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--surface)}
.tools select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.count{color:var(--muted);font-size:14px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;padding-bottom:40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px 14px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;background:var(--tile);aspect-ratio:1/1.08;display:grid;place-items:center}
.pic svg{width:86%;height:auto;display:block}
.pic.ph{background:#fff}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.heart svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2}
.heart.on svg{fill:var(--sale);stroke:var(--sale)}
.info{padding:10px 12px 14px}
.info h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 8px;color:var(--muted);font-size:13px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.price b{font-size:16px}
.price s{color:var(--muted);font-size:13px}
.off{color:var(--sale);font-weight:700;font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:24px 0 32px;color:var(--muted);font-size:14px}
footer a{color:var(--ink)}

/* sheets */
.ov{position:fixed;top:0;bottom:0;left:0;right:0;z-index:40;background:var(--overlay);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--surface);width:100%;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 env(safe-area-inset-bottom,0px);outline:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:800px){
  .ov{align-items:center}
  .sheet.modal{width:min(900px,94vw);border-radius:16px;max-height:90dvh}
  .ov.side{align-items:stretch;justify-content:flex-end}
  .sheet.drawer{width:450px;max-height:none;height:100%;border-radius:0;animation:in .22s ease-out}
  @keyframes in{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
}
.sh-head{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh-head h2{font-size:19px;font-weight:800}
.x{width:36px;height:36px;border-radius:8px;font-size:22px;line-height:1}
.x:hover{background:var(--bg)}
.pad{padding:18px}

/* product sheet */
.pd{display:grid;gap:0}
@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.pd .pic{aspect-ratio:1/1;border-radius:0}
.pd .pic svg{width:80%}
.pd-info{padding:20px}
.pd-info h2{font-size:26px;font-weight:900;letter-spacing:-.02em}
.pd-info .price b{font-size:22px}
.lbl{font-weight:700;margin:20px 0 8px}
.lbl span{font-weight:400;color:var(--muted)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.sz{display:flex;gap:8px;flex-wrap:wrap}
.sz button{min-width:52px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.sz button.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.msg{color:var(--sale);font-size:13px;min-height:18px;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.desc{margin-top:20px;color:var(--muted)}

/* bag */
.li{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.li .pic{aspect-ratio:1/1;border-radius:8px}
.li .pic svg{width:92%}
.li h3{font-size:15px;font-weight:800}
.li .sub{margin:2px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.step button{width:34px;height:34px;font-size:18px}
.step span{min-width:26px;text-align:center;font-weight:700}
.link{color:var(--muted);font-size:13px;text-decoration:underline}
.sum{padding:18px}
.sum .row{padding:4px 0}
.sum .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:17px}
.good{color:var(--good);font-weight:700}
.hint{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 18px 6px}
.stick{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px}

.pd-media{position:relative}
.thumbs{display:flex;gap:8px;padding:10px 14px 4px}
.thumbs button{width:64px;height:64px;border-radius:8px;border:2px solid var(--line);overflow:hidden;background:#fff}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.hero-art.ph{align-items:center;padding:24px 16px}
.hero-art.ph img{width:44%;max-width:250px;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hero-art.ph img:first-child{transform:rotate(-4deg)}
.hero-art.ph img:nth-child(2){transform:rotate(4deg);margin-left:-6%}
/* forms */
.f{display:grid;gap:14px}
.f label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.f input[type=text],.f input[type=tel]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.f .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.er{color:var(--sale);font-size:13px;min-height:0}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;font-weight:500;margin:0;cursor:pointer}
.pay label small{display:block;color:var(--muted);font-weight:400}
.pay input{margin-top:4px;accent-color:var(--accent)}
.ok{width:56px;height:56px;border-radius:50%;background:var(--good);display:grid;place-items:center;margin:8px 0 14px}
.ok svg{width:30px;height:30px;stroke:#fff;stroke-width:3;fill:none}
.oid{font-family:Archivo,sans-serif;font-weight:800}
.wa{background:#1FA855;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#top" id="logo">Urban Cool</a>
    <label class="search"><input id="q" type="search" placeholder="Search tees, hoodies, totes" aria-label="Search products" autocomplete="off"></label>
    <div class="acts">
      <button class="ib" data-a="wishtoggle" aria-label="Show wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 2.9 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.7 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg><span class="dot" id="wc"></span></button>
      <button class="ib" data-a="bag" aria-label="Open bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="dot" id="bc"></span></button>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <div class="hero-copy">
      <h1>Oversized, on purpose.</h1>
      <p>Oversized streetwear from our Instagram, now with easy ordering. Order here and pay on delivery.</p>
      <a class="btn" href="#shop">Shop all</a>
    </div>
    <div class="hero-art" id="heroArt" aria-hidden="true"></div>
  </section>
  <div class="perks" id="perks"></div>

  <section id="shop">
    <div class="cats" id="cats" role="tablist" aria-label="Categories"></div>
    <div class="tools">
      <div class="seg" id="seg" role="group" aria-label="Filter by fit"></div>
      <div class="row" style="gap:12px"><span class="count" id="cnt"></span>
        <select id="sort" aria-label="Sort products">
          <option value="rec">Recommended</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="off">Biggest discount</option>
        </select></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div class="ov" id="ov"><div class="sheet" id="sheet" tabindex="-1" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ EDIT THESE ============ */
const STORE = {
  name: 'Urban Cool',
  whatsapp: '919494615965',      // your WhatsApp number with country code, no + or spaces
  instagram: 'urbancool.studios',        // your Instagram handle
  freeAbove: 999,                // free delivery above this amount
  shipFee: 79                    // delivery fee below that
};
const CATS = [['all','All'],['tees','Oversized tees'],['hoodies','Oversized hoodies'],['crop','Crop tops'],['totes','Tote bags']];
const COL = {
  blk:{n:'Black',h:'#1B1C1F'}, wht:{n:'Off white',h:'#ECE8DE'}, sage:{n:'Sage',h:'#9DB08A'}, sky:{n:'Sky',h:'#9CB9E0'},
  sand:{n:'Sand',h:'#CBB89A'}, lilac:{n:'Lilac',h:'#B9A6E0'}, rust:{n:'Rust',h:'#B4552F'}, grey:{n:'Ash grey',h:'#8C9098'},
  navy:{n:'Navy',h:'#22315B'}, pink:{n:'Blush',h:'#E7B0C4'}, yel:{n:'Butter yellow',h:'#F1EFA0'}
};
/* One product per block. price = selling price. mrp = original (crossed-out) price, or 0 to hide it. photos = image files uploaded next to this file. */
const PRODUCTS = [
  {id:'crop-47',cat:'crop',g:'women',name:'47 Est. 2026 Crop Top',price:299,mrp:0,colors:['yel','blk'],
   photos:{yel:['crop47-yellow-1.jpg','crop47-yellow-2.jpg'],blk:['crop47-black-1.jpg','crop47-black-2.jpg']},
   desc:'Cropped tee with a pale blue 47 print, stars and Est. 2026 on the front.'}
];
const SIZES = ['S','M','L','XL'];
/* ==================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '\u20B9' + Number(n).toLocaleString('en-IN');
const off = p => p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
const mrpOf = p => Math.max(p.mrp || 0, p.price);
function imgsOf(p, c){ const ph = p.photos; if (!ph) return null; const l = ph[c] || ph[p.colors[0]] || Object.values(ph)[0]; return l && l.length ? l : null; }
const isPh = (p, c) => !!imgsOf(p, c);
function visual(p, c, i){ const l = imgsOf(p, c); return l ? `<img src="${esc(l[i || 0] || l[0])}" alt="${esc(p.name)}" loading="lazy">` : art(p, COL[c].h); }
const priceHTML = p => `<div class="price"><b>${inr(p.price)}</b>${off(p) ? `<s>${inr(p.mrp)}</s><span class="off">${off(p)}% off</span>` : ''}</div>`;
function thumbsHTML(p, c){ const l = imgsOf(p, c); if (!l || l.length < 2) return ''; return `<div class="thumbs">${l.map((u, k) => `<button data-a="thumb" data-id="${k}" class="${k === (sel ? sel.i : 0) ? 'on' : ''}" aria-label="Photo ${k + 1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`; }
function refreshPic(){ const p = byId(sel.id); const pic = $('#pdPic'); pic.className = 'pic' + (isPh(p, sel.c) ? ' ph' : ''); pic.innerHTML = visual(p, sel.c, sel.i); $('#pdThumbs').innerHTML = thumbsHTML(p, sel.c); }
const byId = id => PRODUCTS.find(p => p.id === id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let cart = store.get('sl_cart', []).filter(i => byId(i.id));
let wish = store.get('sl_wish', []).filter(byId);
const f = {cat:'all', g:'all', q:'', sort:'rec', wish:false};
let sel = null, view = null, lastOrder = null;

/* ---------- garment art ---------- */
function lum(h){ const n = parseInt(h.slice(1), 16); return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; }
function printText(p, ink, y, size){
  if (!p.print) return '';
  const lines = p.print.split('|');
  return lines.map((t, i) => `<text x="100" y="${y + i*(size+3)}" text-anchor="middle" font-family="Archivo,Arial Black,sans-serif" font-weight="900" font-size="${size}" letter-spacing="1.2" fill="${ink}">${esc(t)}</text>`).join('');
}
function art(p, hex){
  const ink = lum(hex) < 0.5 ? '#F3F3F3' : '#1A1A1A';
  const edge = 'rgba(0,0,0,.30)', shade = 'rgba(0,0,0,.10)';
  let b = '';
  if (p.cat === 'tees'){
    b = `<path d="M62 44 L86 34 Q100 52 114 34 L138 44 L190 84 L170 110 L148 96 L148 178 L52 178 L52 96 L30 110 L10 84 Z" fill="${hex}" stroke="${edge}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M86 34 Q100 52 114 34" fill="none" stroke="${edge}" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 100 V178 M148 100 V178" stroke="${shade}" stroke-width="10"/>
    ${p.pocket ? `<rect x="112" y="84" width="24" height="26" rx="2" fill="${shade}" stroke="${edge}"/>` : ''}
    ${printText(p, ink, 108, 15)}`;
  } else if (p.cat === 'hoodies'){
    b = `<path d="M62 44 L86 36 Q100 54 114 36 L138 44 L194 132 L172 144 L148 102 L148 182 L52 182 L52 102 L28 144 L6 132 Z" fill="${hex}" stroke="${edge}" stroke-width="2" stroke-linejoin="round"/>
    <rect x="52" y="174" width="96" height="8" fill="${shade}"/>
    <path d="M74 42 Q100 4 126 42 Q120 68 100 72 Q80 68 74 42Z" fill="${hex}" stroke="${edge}" stroke-width="2"/>
    <path d="M85 42 Q100 20 115 42 Q111 60 100 62 Q89 60 85 42Z" fill="rgba(0,0,0,.30)"/>
    ${p.zip ? `<path d="M100 72 V182" stroke="${ink}" stroke-width="2" stroke-dasharray="3 3"/>` : `<path d="M93 68 L91 98 M107 68 L109 98" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><path d="M66 138 L134 138 L142 170 L58 170Z" fill="${shade}" stroke="${edge}" stroke-linejoin="round"/>`}
    ${printText(p, ink, 118, 12)}`;
  } else if (p.cat === 'crop'){
    b = `<g transform="translate(0 16)"><path d="M64 44 L86 34 Q100 52 114 34 L136 44 L188 80 L170 104 L146 92 L146 134 L54 134 L54 92 L30 104 L12 80 Z" fill="${hex}" stroke="${edge}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M86 34 Q100 52 114 34" fill="none" stroke="${edge}" stroke-width="5" stroke-linecap="round"/>
    ${p.rib ? [66,76,86,96,106,116,126,136].map(x => `<path d="M${x-8} 62 V132" stroke="${shade}" stroke-width="2"/>`).join('') : ''}
    ${printText(p, ink, 92, 12)}</g>`;
  } else {
    b = `<path d="M74 86 V60 Q74 30 100 30 Q126 30 126 60 V86" fill="none" stroke="${edge}" stroke-width="11" stroke-linecap="round"/>
    <path d="M74 86 V60 Q74 30 100 30 Q126 30 126 60 V86" fill="none" stroke="${hex}" stroke-width="7" stroke-linecap="round"/>
    <path d="M46 80 H154 L160 184 H40 Z" fill="${hex}" stroke="${edge}" stroke-width="2" stroke-linejoin="round"/>
    ${p.id === 'b2' ? `<path d="M46 92 H154" stroke="${ink}" stroke-width="2" stroke-dasharray="4 3"/>` : ''}
    ${printText(p, ink, 138, 14)}`;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.name)}">${b}</svg>`;
}
const genderLabel = g => g === 'men' ? 'Men' : g === 'women' ? 'Women' : 'Men and women';
const catLabel = c => c === 'tees' ? 'Oversized tee' : c === 'hoodies' ? 'Oversized hoodie' : c === 'crop' ? 'Crop top' : 'Tote bag';

/* ---------- static bits ---------- */
document.title = STORE.name + ' | Oversized tees, hoodies, crop tops and totes';
$('#logo').textContent = STORE.name;
(function(){ const hp = PRODUCTS.find(p => imgsOf(p, p.colors[0])); const h = $('#heroArt');
  if (hp){ h.classList.add('ph'); const l = hp.colors.length > 1 ? hp.colors.slice(0, 2).map(c => imgsOf(hp, c)[0]) : imgsOf(hp, hp.colors[0]).slice(0, 2); h.innerHTML = l.map(u => `<img src="${esc(u)}" alt="">`).join(''); }
  else if (PRODUCTS[0]) h.innerHTML = art(PRODUCTS[0], COL[PRODUCTS[0].colors[0]].h); })();
$('#perks').innerHTML = `<span><b>Cash on delivery</b> available</span><span><b>Free delivery</b> above ${inr(STORE.freeAbove)}</span><span>Order confirmed on <b>WhatsApp</b></span>`;
$('#foot').innerHTML = `<p><b style="color:var(--ink)">${esc(STORE.name)}</b>. Follow us on <a href="https://instagram.com/${encodeURIComponent(STORE.instagram)}" target="_blank" rel="noopener">Instagram</a> or message us on <a href="https://wa.me/${esc(STORE.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>.</p>`;
$('#cats').innerHTML = CATS.filter(([k]) => k === 'all' || PRODUCTS.some(p => p.cat === k)).map(([k, l]) => `<button class="chip" role="tab" data-a="cat" data-id="${k}">${l}</button>`).join('');
$('#seg').innerHTML = [['all','All'],['men','Men'],['women','Women']].map(([k, l]) => `<button data-a="gender" data-id="${k}">${l}</button>`).join('');

/* ---------- grid ---------- */
function visible(){
  let l = PRODUCTS.filter(p =>
    (f.cat === 'all' || p.cat === f.cat) &&
    (f.g === 'all' || p.g === f.g || p.g === 'unisex') &&
    (!f.wish || wish.includes(p.id)) &&
    (!f.q || (p.name + ' ' + catLabel(p.cat) + ' ' + genderLabel(p.g)).toLowerCase().includes(f.q)));
  if (f.sort === 'lo') l.sort((a, b) => a.price - b.price);
  if (f.sort === 'hi') l.sort((a, b) => b.price - a.price);
  if (f.sort === 'off') l.sort((a, b) => off(b) - off(a));
  return l;
}
function renderGrid(){
  const l = visible();
  document.querySelectorAll('#cats .chip').forEach(b => { const on = b.dataset.id === f.cat; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.id === f.g));
  $('#cnt').textContent = l.length + (l.length === 1 ? ' item' : ' items') + (f.wish ? ' in wishlist' : '');
  $('#grid').innerHTML = l.length ? l.map(p => `
    <article class="card" data-a="open" data-id="${p.id}">
      <div class="pic ${isPh(p, p.colors[0]) ? 'ph' : ''}">${visual(p, p.colors[0], 0)}
        <button class="heart ${wish.includes(p.id) ? 'on' : ''}" data-a="wish" data-id="${p.id}" aria-label="${wish.includes(p.id) ? 'Remove from' : 'Add to'} wishlist"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 2.9 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.7 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></button></div>
      <div class="info"><h3>${esc(p.name)}</h3><p class="sub">${catLabel(p.cat)} for ${genderLabel(p.g).toLowerCase()}</p>
        ${priceHTML(p)}</div>
    </article>`).join('')
  : `<div class="empty"><h3>${f.wish ? 'Your wishlist is empty' : 'Nothing matches that'}</h3><p>${f.wish ? 'Tap the heart on any product to save it here.' : 'Try a different search or clear the filters.'}</p><button class="btn alt" data-a="clear" style="margin-top:14px">Show all products</button></div>`;
  const wc = $('#wc'); wc.textContent = wish.length; wc.classList.toggle('on', wish.length > 0);
}
function badges(){
  const n = cart.reduce((s, i) => s + i.qty, 0);
  const bc = $('#bc'); bc.textContent = n; bc.classList.toggle('on', n > 0);
  store.set('sl_cart', cart); store.set('sl_wish', wish);
}

/* ---------- sheets ---------- */
function openSheet(kind, html, drawer){
  view = kind;
  const s = $('#sheet');
  s.className = 'sheet ' + (drawer ? 'drawer' : 'modal');
  $('#ov').className = 'ov on' + (drawer ? ' side' : '');
  s.innerHTML = html;
  s.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  s.focus({preventScroll:true});
}
function closeSheet(){ view = null; $('#ov').className = 'ov'; document.body.style.overflow = ''; }
const head = (t, back) => `<div class="sh-head"><h2>${t}</h2><button class="x" data-a="${back || 'close'}" aria-label="${back ? 'Back' : 'Close'}">${back ? '\u2039' : '\u00D7'}</button></div>`;
let toastT;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 1800); }

function productHTML(){
  const p = byId(sel.id), needSize = p.cat !== 'totes';
  return `<div class="sh-head" style="position:absolute;right:0;top:0;border:0;background:none;z-index:3"><span></span><button class="x" data-a="close" aria-label="Close" style="background:var(--surface)">\u00D7</button></div>
  <div class="pd"><div class="pd-media"><div class="pic ${isPh(p, sel.c) ? 'ph' : ''}" id="pdPic">${visual(p, sel.c, sel.i)}</div><div id="pdThumbs">${thumbsHTML(p, sel.c)}</div></div>
  <div class="pd-info">
    <h2>${esc(p.name)}</h2><p class="sub">${catLabel(p.cat)} for ${genderLabel(p.g).toLowerCase()}</p>
    ${priceHTML(p)}
    <p class="note">${p.price >= STORE.freeAbove ? 'Free delivery.' : 'Free delivery above ' + inr(STORE.freeAbove) + '.'}</p>
    <div class="lbl">Color <span id="cn">${COL[sel.c].n}</span></div>
    ${p.colors.length > 1 ? `<div class="sw">${p.colors.map(c => `<button data-a="color" data-id="${c}" class="${c === sel.c ? 'on' : ''}" style="background:${COL[c].h}" aria-label="${COL[c].n}"></button>`).join('')}</div>` : ''}
    ${needSize ? `<div class="lbl">Size</div><div class="sz">${SIZES.map(s => `<button data-a="size" data-id="${s}" class="${s === sel.s ? 'on' : ''}">${s}</button>`).join('')}</div>
    <p class="note">Cut oversized. Go one size down for a closer fit.</p>` : `<div class="lbl">Size <span>One size</span></div>`}
    <p class="msg" id="pmsg" role="alert"></p>
    <div class="two"><button class="btn alt" data-a="add">Add to bag</button><button class="btn" data-a="buy">Buy now</button></div>
    <p class="desc">${esc(p.desc)}</p>
  </div></div>`;
}
function openProduct(id){ const p = byId(id); sel = {id, c:p.colors[0], i:0, s: p.cat === 'totes' ? 'One size' : null}; openSheet('product', productHTML(), false); $('#sheet').style.position = 'relative'; }

function tryAdd(){
  const p = byId(sel.id);
  if (!sel.s){ $('#pmsg').textContent = 'Choose a size to continue.'; return false; }
  const key = [p.id, sel.c, sel.s].join('|');
  const ex = cart.find(i => i.key === key);
  if (ex) ex.qty++; else cart.push({key, id:p.id, c:sel.c, s:sel.s, qty:1});
  badges(); return true;
}

function totals(){
  let mrp = 0, sub = 0;
  cart.forEach(i => { const p = byId(i.id); mrp += mrpOf(p) * i.qty; sub += p.price * i.qty; });
  const ship = sub === 0 || sub >= STORE.freeAbove ? 0 : STORE.shipFee;
  return {mrp, sub, disc: mrp - sub, ship, total: sub + ship};
}
function bagHTML(){
  if (!cart.length) return head('Your bag') + `<div class="pad" style="text-align:center;padding-top:60px"><h3>Your bag is empty</h3><p class="sub">Add something you like and it will show up here.</p><button class="btn" data-a="close" style="margin-top:14px">Keep shopping</button></div>`;
  const t = totals();
  const items = cart.map(i => { const p = byId(i.id); return `
    <div class="li"><div class="pic ${isPh(p, i.c) ? 'ph' : ''}">${visual(p, i.c, 0)}</div>
    <div><h3>${esc(p.name)}</h3><p class="sub">${COL[i.c].n}, ${esc(i.s)}</p>
      <div class="row"><div class="step"><button data-a="qty" data-k="${esc(i.key)}" data-d="-1" aria-label="Decrease quantity">\u2212</button><span>${i.qty}</span><button data-a="qty" data-k="${esc(i.key)}" data-d="1" aria-label="Increase quantity">+</button></div>
      <b>${inr(p.price * i.qty)}</b></div>
      <button class="link" data-a="rm" data-k="${esc(i.key)}">Remove</button></div></div>`; }).join('');
  const need = STORE.freeAbove - t.sub;
  return head('Your bag') + items +
    (need > 0 ? `<p class="hint" style="margin-top:14px">Add ${inr(need)} more to get free delivery.</p>` : `<p class="hint good" style="margin-top:14px">You get free delivery on this order.</p>`) +
    `<div class="sum">${t.disc > 0 ? `<div class="row"><span>Total MRP</span><span>${inr(t.mrp)}</span></div>
    <div class="row"><span>Discount</span><span class="good">\u2212${inr(t.disc)}</span></div>` : `<div class="row"><span>Items</span><span>${inr(t.sub)}</span></div>`}
    <div class="row"><span>Delivery</span><span>${t.ship ? inr(t.ship) : '<span class="good">Free</span>'}</span></div>
    <div class="row tot"><span>Total</span><span>${inr(t.total)}</span></div></div>
    <div class="stick"><button class="btn full" data-a="checkout">Checkout \u00B7 ${inr(t.total)}</button></div>`;
}
function openBag(){ openSheet('bag', bagHTML(), true); }

function checkoutHTML(){
  const t = totals();
  return head('Delivery details', 'bag') + `<div class="pad"><form class="f" id="cf" novalidate onsubmit="return false">
    <div><label for="fn">Full name</label><input id="fn" type="text" autocomplete="name"><div class="er" data-for="fn"></div></div>
    <div><label for="fp">Mobile number</label><input id="fp" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit number"><div class="er" data-for="fp"></div></div>
    <div><label for="fa">Address</label><input id="fa" type="text" autocomplete="street-address" placeholder="House no, building, street, area"><div class="er" data-for="fa"></div></div>
    <div class="g2"><div><label for="fc">City</label><input id="fc" type="text" autocomplete="address-level2"><div class="er" data-for="fc"></div></div>
    <div><label for="fs">State</label><input id="fs" type="text" autocomplete="address-level1"><div class="er" data-for="fs"></div></div></div>
    <div><label for="fz">Pincode</label><input id="fz" type="text" inputmode="numeric" maxlength="6" autocomplete="postal-code"><div class="er" data-for="fz"></div></div>
    <div><label>Payment</label><div class="pay">
      <label><input type="radio" name="pay" value="Cash on delivery" checked><span>Cash on delivery<small>Pay when the order arrives.</small></span></label>
      <label><input type="radio" name="pay" value="UPI"><span>UPI<small>We will send you payment details on WhatsApp.</small></span></label></div></div>
  </form></div>
  <div class="stick"><div class="row" style="margin-bottom:10px"><span>Total to pay</span><b>${inr(t.total)}</b></div><button class="btn full" data-a="place">Place order</button></div>`;
}

function validate(){
  const v = id => $('#' + id).value.trim();
  const rules = {
    fn: v('fn').length >= 2 ? '' : 'Enter your full name.',
    fp: /^[6-9]\d{9}$/.test(v('fp')) ? '' : 'Enter a valid 10-digit mobile number.',
    fa: v('fa').length >= 8 ? '' : 'Enter your full address.',
    fc: v('fc') ? '' : 'Enter your city.',
    fs: v('fs') ? '' : 'Enter your state.',
    fz: /^\d{6}$/.test(v('fz')) ? '' : 'Enter a valid 6-digit pincode.'
  };
  let first = null;
  Object.keys(rules).forEach(k => { document.querySelector(`.er[data-for="${k}"]`).textContent = rules[k]; if (rules[k] && !first) first = k; });
  if (first){ $('#' + first).focus(); return null; }
  return {name:v('fn'), phone:v('fp'), addr:v('fa'), city:v('fc'), state:v('fs'), pin:v('fz'), pay: document.querySelector('input[name=pay]:checked').value};
}

function orderText(o){
  const lines = o.items.map((i, n) => `${n + 1}. ${i.name} (${i.color}, ${i.size}) x ${i.qty} = ${inr(i.price * i.qty)}`).join('\n');
  return `New order ${o.id}\n\n${lines}\n\nItems: ${inr(o.sub)}\nDelivery: ${o.ship ? inr(o.ship) : 'Free'}\nTotal: ${inr(o.total)}\nPayment: ${o.a.pay}\n\nName: ${o.a.name}\nPhone: ${o.a.phone}\nAddress: ${o.a.addr}, ${o.a.city}, ${o.a.state} - ${o.a.pin}`;
}
function place(){
  const a = validate(); if (!a) return;
  const t = totals();
  lastOrder = {
    id: 'UC' + Date.now().toString(36).toUpperCase().slice(-6), a, sub:t.sub, ship:t.ship, total:t.total,
    items: cart.map(i => { const p = byId(i.id); return {name:p.name, color:COL[i.c].n, size:i.s, qty:i.qty, price:p.price}; })
  };
  const orders = store.get('sl_orders', []); orders.push({id:lastOrder.id, total:lastOrder.total, at:Date.now()}); store.set('sl_orders', orders.slice(-20));
  cart = []; badges();
  openSheet('done', doneHTML(), true);
}
function doneHTML(){
  const o = lastOrder;
  const url = `https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(orderText(o))}`;
  return head('Order placed') + `<div class="pad"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3 style="font-size:22px">Send your order to ${esc(STORE.name)}</h3>
    <p class="sub" style="margin:8px 0 16px">Your order <span class="oid">${o.id}</span> is ready. Tap the button below to send it on WhatsApp. We confirm it there and ship it to you.</p>
    <a class="btn full wa" href="${url}" target="_blank" rel="noopener">Send order on WhatsApp</a>
    <button class="btn alt full" data-a="copy" style="margin-top:10px">Copy order details</button>
    <div class="sum" style="padding:20px 0 0">
      ${o.items.map(i => `<div class="row"><span>${esc(i.name)} (${esc(i.color)}, ${esc(i.size)}) x ${i.qty}</span><span>${inr(i.price * i.qty)}</span></div>`).join('')}
      <div class="row"><span>Delivery</span><span>${o.ship ? inr(o.ship) : 'Free'}</span></div>
      <div class="row tot"><span>Total (${esc(o.a.pay)})</span><span>${inr(o.total)}</span></div>
      <p class="note" style="margin-top:14px">Delivering to ${esc(o.a.name)}, ${esc(o.a.addr)}, ${esc(o.a.city)}, ${esc(o.a.state)} ${esc(o.a.pin)}</p></div>
    <button class="btn alt full" data-a="close" style="margin-top:18px">Continue shopping</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'ov'){ closeSheet(); return; }
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'open') openProduct(id);
  else if (a === 'wish'){ wish = wish.includes(id) ? wish.filter(x => x !== id) : wish.concat(id); badges(); renderGrid(); }
  else if (a === 'cat'){ f.cat = id; renderGrid(); }
  else if (a === 'gender'){ f.g = id; renderGrid(); }
  else if (a === 'wishtoggle'){ f.wish = !f.wish; renderGrid(); $('#shop').scrollIntoView({behavior:'smooth'}); }
  else if (a === 'clear'){ Object.assign(f, {cat:'all', g:'all', q:'', wish:false}); $('#q').value = ''; renderGrid(); }
  else if (a === 'bag') openBag();
  else if (a === 'close') closeSheet();
  else if (a === 'thumb'){ sel.i = Number(id); refreshPic(); }
  else if (a === 'color'){ sel.c = id; sel.i = 0; refreshPic(); $('#cn').textContent = COL[id].n; document.querySelectorAll('.sw button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); }
  else if (a === 'size'){ sel.s = id; $('#pmsg').textContent = ''; document.querySelectorAll('.sz button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); }
  else if (a === 'add'){ if (tryAdd()) toast('Added to bag'); }
  else if (a === 'buy'){ if (tryAdd()) openBag(); }
  else if (a === 'qty'){ const i = cart.find(x => x.key === t.dataset.k); if (i){ i.qty += Number(t.dataset.d); if (i.qty < 1) cart = cart.filter(x => x !== i); badges(); openBag(); } }
  else if (a === 'rm'){ cart = cart.filter(x => x.key !== t.dataset.k); badges(); openBag(); }
  else if (a === 'checkout') openSheet('checkout', checkoutHTML(), true);
  else if (a === 'place') place();
  else if (a === 'copy'){ try { navigator.clipboard.writeText(orderText(lastOrder)).then(() => toast('Order details copied'), () => toast('Could not copy')); } catch(err){ toast('Could not copy'); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && view) closeSheet(); });
$('#q').addEventListener('input', e => { f.q = e.target.value.trim().toLowerCase(); renderGrid(); });
$('#sort').addEventListener('change', e => { f.sort = e.target.value; renderGrid(); });

renderGrid(); badges();
</script>
</body>
</html>
